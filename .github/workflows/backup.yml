name: Back up the database

# Weekly encrypted backup of the Supabase database, kept for 90 days as a
# workflow artifact. The repo is public, so the dump is encrypted with a
# passphrase that only lives in the BACKUP_PASSPHRASE secret.
#
# To restore: download the artifact, then
#   gpg --decrypt nest-backup.sql.gz.gpg | gunzip | psql "<database url>"
on:
  schedule:
    - cron: '23 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check the secrets are set
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Add the SUPABASE_DB_URL and BACKUP_PASSPHRASE repository secrets."
            exit 1
          fi

      # pg_dump must be at least the server's version (Postgres 17), so run it
      # from the official image instead of the runner's older client.
      - name: Dump, compress and encrypt
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -o pipefail
          docker run --rm -e DB_URL="$SUPABASE_DB_URL" postgres:17 \
            sh -c 'pg_dump --no-owner --no-privileges --schema=public --schema=auth "$DB_URL"' \
            | gzip -9 \
            | gpg --batch --yes --symmetric --cipher-algo AES256 \
                --passphrase-fd 3 --output nest-backup.sql.gz.gpg 3<<<"$BACKUP_PASSPHRASE"
          ls -l nest-backup.sql.gz.gpg

      - uses: actions/upload-artifact@v4
        with:
          name: nest-backup-${{ github.run_id }}
          path: nest-backup.sql.gz.gpg
          retention-days: 90
          if-no-files-found: error
